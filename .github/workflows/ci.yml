
name: CampusFix Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: campusfix-production-deploy
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Test, Compile and Build Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}

      - name: Compile TypeScript
        run: npm run build

      - name: Build production Docker image
        run: docker build --target production -t campus-x-server:ci .

      - name: Prepare image for deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag campus-x-server:ci campus-x-server:latest
          docker save campus-x-server:latest | gzip > campus-x-server.tar.gz

      - name: Upload production image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: campus-x-production-image
          path: campus-x-server.tar.gz
          retention-days: 1

  deploy:
    name: Deploy API on EC2
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Download production image
        uses: actions/download-artifact@v4
        with:
          name: campus-x-production-image

      - name: Load production image
        run: |
          set -euo pipefail
          gunzip -c campus-x-server.tar.gz | docker load
          rm -f campus-x-server.tar.gz

      - name: Deploy API
        run: |
          set -euo pipefail

          docker compose \
            --env-file "$HOME/.env.production" \
            -f "$HOME/compose.prod.yaml" \
            up -d --no-deps --force-recreate api

          for i in $(seq 1 12); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo
              echo "Deployment successful."
              exit 0
            fi
            sleep 5
          done

          echo "Health check failed after deployment."
          docker logs --tail 100 campusfix-api
          exit 1
