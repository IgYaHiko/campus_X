
name: CampusFix Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test, Compile and Build Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}

      - name: Compile TypeScript
        run: npm run build

      - name: Build production Docker image
        run: |
          docker build --target production \
            -t campus-x-server:ci .

      - name: Prepare image for deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag campus-x-server:ci campus-x-server:latest
          docker save campus-x-server:latest | gzip > campus-x-server.tar.gz

      - name: Configure SSH
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          test -n "$EC2_HOST" || {
            echo "EC2_HOST secret is empty."
            exit 1
          }

          test -n "$EC2_SSH_KEY" || {
            echo "EC2_SSH_KEY secret is empty."
            exit 1
          }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/campus-x-key
          chmod 600 ~/.ssh/campus-x-key

          echo "Validating SSH private key..."
          ssh-keygen -y -f ~/.ssh/campus-x-key > /dev/null

          echo "Scanning EC2 SSH host key..."
          if ! ssh-keyscan -T 10 -p 22 -H "$EC2_HOST" \
            > ~/.ssh/known_hosts 2> /tmp/ssh-keyscan-error.log; then
            cat /tmp/ssh-keyscan-error.log
            echo "SSH host scan failed. Check EC2_HOST and inbound TCP port 22."
            exit 1
          fi

          test -s ~/.ssh/known_hosts || {
            echo "No SSH host key was received."
            exit 1
          }

      - name: Transfer image to EC2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail

          scp \
            -i ~/.ssh/campus-x-key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            campus-x-server.tar.gz \
            "$EC2_USER@$EC2_HOST:/tmp/campus-x-server.tar.gz"

      - name: Deploy API on EC2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/campus-x-key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail

          cd "$HOME"

          gunzip -c /tmp/campus-x-server.tar.gz | docker load
          rm -f /tmp/campus-x-server.tar.gz

          docker compose \
            --env-file "$HOME/.env.production" \
            -f "$HOME/compose.prod.yaml" \
            up -d --no-deps --force-recreate api

          for i in $(seq 1 12); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo
              echo "Deployment successful."
              exit 0
            fi
            sleep 5
          done

          echo "Health check failed after deployment."
          docker logs --tail 100 campusfix-api
          exit 1
          REMOTE

      - name: Remove temporary SSH key
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: rm -f ~/.ssh/campus-x-key
